<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>FI$HING!</title>
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="FI$HING!">
<meta name="theme-color" content="#0a1116">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow:wght@400;500;600;700&family=Barlow+Condensed:wght@500;600;700&display=swap">
<style>
/* Layout: full-bleed canvas scene with a thin glass HUD on top and a dark deck bar below; panels are dark gear-catalog sheets */
:root{
 --ink:#e8eef1;--mute:#97a9b3;--faint:#5f717b;
 --glass:rgba(9,16,21,.58);--panel:#121a20;--panel2:#1a242b;--line:rgba(255,255,255,.09);
 --accent:#ff8a1f;--accent-ink:#1b0f02;--good:#5cc98a;--bad:#ef6a5b;--warn:#f2c14e;
 --display:'Barlow Condensed','Arial Narrow','Helvetica Neue',sans-serif;
 --body:'Barlow','Segoe UI','Helvetica Neue',system-ui,sans-serif;
 color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden;background:#0a1116;font-family:var(--body);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;touch-action:manipulation;-webkit-touch-callout:none}
button{font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent;color:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
#stage{position:relative;flex:1;min-height:0;overflow:hidden}
canvas#game{display:block;width:100%;height:100%;touch-action:none;cursor:default}
canvas#game.grab{cursor:none}canvas#game.point{cursor:pointer}
#hud{position:absolute;top:0;left:0;right:0;display:flex;align-items:center;gap:8px;padding:8px 10px;padding-top:max(8px,env(safe-area-inset-top));z-index:2;pointer-events:none;background:linear-gradient(rgba(5,10,14,.55),rgba(5,10,14,0))}
#hud>*{pointer-events:auto}
.pill{display:flex;align-items:center;gap:6px;background:var(--glass);border:1px solid var(--line);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border-radius:999px;padding:4px 12px;font-family:var(--display);font-weight:600;font-size:18px;letter-spacing:.02em;white-space:nowrap;font-variant-numeric:tabular-nums;transition:transform .15s}
.pill small{font-family:var(--body);font-size:11px;font-weight:600;color:var(--mute);text-transform:uppercase;letter-spacing:.08em}
.pill.bump{transform:scale(1.12);border-color:var(--good)}
.pill.full{border-color:var(--bad);color:#ffd2cc;animation:shake .5s}
#locName{flex:1;text-align:center;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:0 1px 3px rgba(0,0,0,.6)}
#muteBtn,#adminBtn{width:36px;height:34px;border-radius:999px;border:1px solid var(--line);background:var(--glass);font-size:16px}
.admForm{display:flex;gap:8px;margin:16px 0 6px}.admForm input{flex:1;min-width:0;font:inherit;font-size:20px;padding:10px 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel2);color:var(--ink);letter-spacing:.1em;-webkit-user-select:text;user-select:text}.admForm input:focus{outline:2px solid var(--accent)}
.admMsg{color:var(--bad);min-height:20px;font-weight:600}.admGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}.admGrid .btn{width:100%;white-space:normal}
#wxPill{cursor:help}
#hint{position:absolute;top:54px;left:50%;transform:translateX(-50%);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);padding:7px 16px;border-radius:10px;font-weight:600;font-size:16px;text-align:center;max-width:min(92%,620px);pointer-events:none;line-height:1.3;text-wrap:balance;z-index:1}
#hint small{display:block;font-size:12px;color:var(--mute);font-weight:500;margin-top:2px}
#hint.alert{border-color:var(--accent);color:#fff;background:rgba(120,45,0,.72);animation:hpulse .35s infinite alternate}
#actionBtn{position:absolute;right:16px;bottom:16px;width:96px;height:96px;border-radius:50%;font-family:var(--display);font-size:22px;font-weight:700;letter-spacing:.06em;border:3px solid var(--accent);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);color:#fff;touch-action:none;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.45);z-index:1}
#actionBtn small{display:block;font-family:var(--body);font-size:10px;font-weight:600;color:var(--mute);letter-spacing:.08em;margin-top:3px}
#actionBtn.held{transform:scale(.95);background:rgba(255,138,31,.25)}
#actionBtn.hook{background:var(--accent);color:var(--accent-ink);animation:pulse .25s infinite alternate}
#actionBtn.hook small{color:var(--accent-ink)}
#actionBtn.wait{border-color:rgba(255,255,255,.25);color:var(--mute)}
#actionBtn.reel{border-color:var(--bad)}
#actionBtn.reel.held{background:rgba(239,106,91,.35)}
#pullBox{position:absolute;left:14px;bottom:16px;display:flex;gap:10px;z-index:1}
#pullBox button{width:76px;height:76px;border-radius:50%;border:2px solid rgba(255,255,255,.35);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:var(--display);font-size:28px;font-weight:700;line-height:1;touch-action:none;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#pullBox button small{display:block;font-size:11px;letter-spacing:.1em;color:var(--mute)}
#pullBox button.on{transform:scale(.94);background:rgba(255,255,255,.18)}
#pullBox button.cue{border-color:var(--accent);background:rgba(255,138,31,.85);color:var(--accent-ink);animation:pulse .25s infinite alternate}
#pullBox button.cue small{color:var(--accent-ink)}
#toasts{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;width:min(90%,560px);z-index:1}
.toast{background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);border:1px solid var(--line);border-left:3px solid var(--mute);color:#fff;padding:8px 14px;border-radius:8px;font-weight:600;font-size:15px;animation:toastIn .25s ease-out;text-align:center}
.toast.good{border-left-color:var(--good)}.toast.bad{border-left-color:var(--bad)}.toast.gold{border-left-color:var(--accent)}
#toolbar{display:flex;gap:2px;padding:4px 6px;padding-bottom:max(4px,env(safe-area-inset-bottom));background:#0b1217;border-top:1px solid var(--line);z-index:2}
#toolbar button{flex:1;min-width:0;border:none;border-radius:8px;padding:7px 2px;background:transparent;font-family:var(--display);font-size:15px;font-weight:600;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#toolbar button .e{font-size:17px;display:block;line-height:1.15;filter:saturate(.6)}
#toolbar button:hover{background:rgba(255,255,255,.06);color:var(--ink)}
#toolbar button:active{background:rgba(255,255,255,.1)}
#toolbar.disabled button{opacity:.35}
.hidden{display:none!important}
.overlay{position:fixed;inset:0;background:rgba(3,8,12,.66);display:flex;align-items:center;justify-content:center;z-index:10;padding:10px}
.panel{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:14px;width:100%;max-width:760px;max-height:92%;overflow:auto;padding:18px 18px 22px;box-shadow:0 20px 60px rgba(0,0,0,.6);animation:pop .2s ease-out}
.panel h2{font-family:var(--display);font-size:30px;font-weight:700;letter-spacing:.03em;text-transform:uppercase;margin-bottom:2px;text-wrap:balance}
.brand{font-family:var(--display);font-weight:700;font-size:56px;line-height:1;letter-spacing:.04em;color:var(--ink);margin:4px 0 14px}.brand span{color:var(--accent)}
.panel h3{font-family:var(--display);font-size:16px;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--mute);margin:20px 0 8px}
.panel p{margin:4px 0;line-height:1.45;max-width:65ch}
.sub{color:var(--mute);font-weight:500}
.close{position:sticky;float:right;top:0;right:0;width:40px;height:40px;border-radius:50%;border:1px solid var(--line);background:var(--panel2);font-size:18px;z-index:3}
.big{display:block;width:100%;padding:12px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;border:none;border-radius:10px;margin:10px 0}
.big:active{transform:translateY(1px)}
.gold,.green{background:var(--accent);color:var(--accent-ink)}
.red{background:transparent;border:1px solid var(--bad)!important;color:var(--bad)}.gray{background:var(--panel2);color:var(--ink)}
.list{display:flex;flex-direction:column;gap:6px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:8px 12px}
.row img{width:72px;height:42px;object-fit:contain;flex:none}
.row .info{flex:1;min-width:0}
.row .info small{color:var(--mute)}
.row .price{font-family:var(--display);font-weight:700;font-size:20px;color:var(--good);white-space:nowrap;font-variant-numeric:tabular-nums}
.btn{border:none;border-radius:8px;padding:8px 14px;font-family:var(--display);font-weight:700;font-size:17px;letter-spacing:.05em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);white-space:nowrap}
.btn:disabled{background:#2a353c;color:var(--faint);cursor:not-allowed}
.btn:active:not(:disabled){transform:translateY(1px)}
.btn.blue,.btn.purple{background:#d9e4ea;color:#0d1418}
.rar{display:inline-block;font-size:11px;font-weight:700;padding:1px 8px;border-radius:4px;vertical-align:middle;letter-spacing:.06em;text-transform:uppercase;border:1px solid currentColor}
.empty{text-align:center;padding:30px 10px;font-size:17px;color:var(--mute)}
.gear{display:grid;gap:10px}
.gearRow{display:grid;grid-template-columns:1fr auto;gap:6px 16px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:14px 16px}
.gearRow .k{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:var(--mute)}
.gearRow .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.05}
.gearRow .d{font-size:14px;color:var(--mute);line-height:1.4;grid-column:1/-1}
.gearRow .lvl{display:flex;gap:4px;margin-top:6px}
.gearRow .lvl i{width:22px;height:5px;border-radius:3px;background:#2a353c}
.gearRow .lvl i.on{background:var(--accent)}
.gearRow .act{display:flex;flex-direction:column;align-items:flex-end;gap:4px;grid-row:1/3;grid-column:2}
.gearRow .act small{color:var(--mute);font-size:12px}
.gearRow .max{font-family:var(--display);font-size:16px;letter-spacing:.1em;color:var(--good);text-transform:uppercase}
.locs{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.loc{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--panel2);display:flex;flex-direction:column}
.loc.here{border-color:var(--accent)}
.loc .pv{height:64px}
.loc .bd{padding:10px 12px;display:flex;flex-direction:column;gap:6px;flex:1}
.loc .bd b{font-family:var(--display);font-size:20px;letter-spacing:.03em}.loc .d{font-size:13px;color:var(--mute);flex:1}
.loc .fishes{display:flex;gap:2px;flex-wrap:wrap}.loc .fishes img{width:40px;height:24px;object-fit:contain}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.card{border:1px solid var(--line);border-radius:10px;padding:8px;background:var(--panel2);font-size:13px;line-height:1.45;color:var(--mute)}
.card img{width:100%;height:62px;object-fit:contain}
.card b{font-family:var(--display);font-size:17px;display:block;color:var(--ink);letter-spacing:.02em}
.card.unk{opacity:.7}
.bar{height:8px;background:#2a353c;border-radius:4px;overflow:hidden;margin-top:8px}
.bar div{height:100%;background:var(--accent)}
.steps{padding-left:22px}.steps li{margin:8px 0;line-height:1.45;max-width:68ch}
.keys{border-collapse:collapse}.keys td{padding:5px 10px 5px 0;border-bottom:1px solid var(--line);vertical-align:top}
.kbd{display:inline-block;background:var(--panel2);border:1px solid #3a4851;border-bottom-width:3px;border-radius:5px;padding:0 6px;font-weight:700;font-size:12px;margin-right:2px}
#catchCard .panel{max-width:420px;text-align:center;padding-top:14px}
#ccBanner{font-family:var(--display);font-size:14px;font-weight:700;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
#ccCanvas{width:300px;height:254px;max-width:100%;display:block;margin:8px auto;border-radius:10px}
#ccName{font-size:32px}
#ccStats{display:flex;justify-content:center;gap:8px;margin:10px 0;flex-wrap:wrap}
#ccStats div{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 12px;font-family:var(--display);font-weight:600;font-size:19px;font-variant-numeric:tabular-nums}
#ccFact{font-size:14px;color:var(--mute);margin:0 auto}
.order{display:flex;align-items:center;gap:12px;background:var(--panel2);border:1px solid var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0}
.order .oe{font-size:38px;line-height:1}.order .ob{flex:1;font-size:15px;min-width:0}.order img{width:48px;height:28px;object-fit:contain;vertical-align:middle}
@keyframes pulse{from{transform:scale(1)}to{transform:scale(1.05)}}
@keyframes hpulse{from{transform:translateX(-50%) scale(1)}to{transform:translateX(-50%) scale(1.04)}}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:scale(1);opacity:1}}
@keyframes toastIn{from{transform:translateY(10px);opacity:0}to{transform:none;opacity:1}}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
html,body{overscroll-behavior:none}
/* touch controls: a thumbstick to steer the lure and a DASH button to strike */
#stick{position:absolute;right:max(24px,env(safe-area-inset-right));bottom:24px;width:136px;height:136px;border-radius:50%;background:rgba(9,16,21,.45);border:2px solid rgba(255,255,255,.28);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);touch-action:none;z-index:1}
#stick::after{content:"";position:absolute;inset:30%;border-radius:50%;border:1px dashed rgba(255,255,255,.18)}
#stickKnob{position:absolute;left:50%;top:50%;width:60px;height:60px;margin:-30px 0 0 -30px;border-radius:50%;background:rgba(232,238,241,.88);box-shadow:0 4px 12px rgba(0,0,0,.45);pointer-events:none}
#dashBtn{position:absolute;left:max(24px,env(safe-area-inset-left));bottom:132px;width:80px;height:80px;border-radius:50%;border:3px solid var(--accent);background:var(--glass);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);font-family:var(--display);font-size:19px;font-weight:700;letter-spacing:.06em;touch-action:none;z-index:1;box-shadow:0 6px 18px rgba(0,0,0,.45)}
#actionBtn.lefty{right:auto;left:max(16px,env(safe-area-inset-left))}
#dashBtn.on{background:var(--accent);color:var(--accent-ink)}
#dashBtn.cool{opacity:.5}
@media (pointer:coarse){
 #toolbar button{padding:10px 2px;font-size:16px}#toolbar button .e{font-size:21px}
 .close{width:48px;height:48px}.btn{padding:12px 18px;font-size:18px}.big{padding:15px}
 #muteBtn{width:44px;height:40px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:560px){
 #locName{font-size:15px}.pill{font-size:15px;padding:3px 9px}.pill small{display:none}
 #wxPill .tm{display:none}
 #toolbar button{font-size:11px}
 #hint{font-size:14px;top:50px}
 #actionBtn{width:84px;height:84px;font-size:19px;right:10px;bottom:10px}#actionBtn.lefty{left:10px}#dashBtn{bottom:110px}
 #pullBox{left:10px;bottom:10px}#pullBox button{width:68px;height:68px;font-size:24px}
 .panel h2{font-size:24px}
 .gearRow{grid-template-columns:1fr}.gearRow .act{grid-row:auto;grid-column:1;align-items:stretch}
}
</style>
</head>
<body>
<div id="app">
 <main id="stage">
  <canvas id="game" aria-label="Fishing game area"></canvas>
  <header id="hud">
   <div class="pill" id="moneyPill" title="Your money"><span id="money">$0</span></div>
   <div id="locName">Home Pond</div>
   <div class="pill" id="wxPill" title="Weather">☀️ <span class="tm">8:00 AM</span></div>
   <div class="pill" id="bucketPill" title="Fish in your cooler"><small>Cooler</small> <span id="bucketCount">0/5</span></div>
   <button id="adminBtn" title="Admin commands" aria-label="Admin commands">🔑</button>
   <button id="muteBtn" title="Sound on/off (M)" aria-label="Toggle sound">🔊</button>
  </header>
  <div id="hint">Loading…</div>
  <button id="actionBtn" aria-label="Action">CAST</button>
  <div id="stick" class="hidden" aria-label="Steer the lure"><div id="stickKnob"></div></div>
  <button id="dashBtn" class="hidden" aria-label="Dash">DASH</button>
  <div id="pullBox" class="hidden"><button id="pullL" aria-label="Pull rod left">←<small>PULL</small></button><button id="pullR" aria-label="Pull rod right">→<small>PULL</small></button></div>
  <div id="toasts"></div>
 </main>
 <nav id="toolbar">
  <button data-panel="market"><span class="e">🧊</span>Cooler</button>
  <button data-panel="shop"><span class="e">🧰</span>Tackle</button>
  <button data-panel="travel"><span class="e">🧭</span>Helm</button>
  <button data-panel="log"><span class="e">📓</span>Logbook</button>
  <button data-panel="help"><span class="e">❔</span>Help</button>
 </nav>
</div>
<div id="modal" class="overlay hidden"><div class="panel" id="panel"><button class="close" id="closeBtn" aria-label="Close">✕</button><div id="panelBody"></div></div></div>
<div id="catchCard" class="overlay hidden"><div class="panel">
 <div id="ccBanner">New species</div>
 <canvas id="ccCanvas" width="600" height="508"></canvas>
 <h2 id="ccName">Fish</h2>
 <div id="ccRarity"></div>
 <div id="ccStats"></div>
 <p id="ccFact"></p>
 <button class="big green" id="ccOk">Put it in the cooler</button>
</div></div>
<script>
'use strict';
/*DATA_START*/
const RARITY={
 common:{label:'Common',color:'#4caf50',weight:60},
 uncommon:{label:'Uncommon',color:'#1e88e5',weight:28},
 rare:{label:'Rare',color:'#8e24aa',weight:10},
 legendary:{label:'Legendary',color:'#ff8f00',weight:2.5}

// depth = how deep the water is (meters); fish d:[top,bottom] = where they swim (0 = surface, 1 = bottom)
// wx = how likely each kind of weather is at that place
const LOCS=[
 {id:'pond',depth:25,dpx:2.6,name:'Home Pond',price:0,emoji:'🏡',desc:'A calm little pond behind your house. Perfect for beginners!',wx:{clear:5,cloudy:3,rain:2,storm:0.6,fog:1},
  theme:{sky:['#5d93c4','#d4e2ea'],water:['#4f7568','#0f2622'],shore:'#55703a',shore2:'#4a6436',shadow:'rgba(10,40,50,0.30)',sun:'day'}},
 {id:'river',depth:35,dpx:3.0,name:'Rushing River',price:200,emoji:'🏞️',desc:'Fast, splashy water full of trout and salmon.',wx:{clear:4,cloudy:3,rain:3,storm:1,fog:1.5},
  theme:{sky:['#6b9cc8','#dce7ec'],water:['#4b7a80','#0e2a32'],shore:'#5b7048',shore2:'#4c6340',shadow:'rgba(10,30,50,0.32)',sun:'day'}},
 {id:'lake',depth:70,dpx:4.0,name:'Mountain Lake',price:800,emoji:'⛰️',desc:'A big deep lake under snowy mountains. Pretty sunsets!',wx:{clear:4,cloudy:3,rain:2,storm:1.2,fog:2},
  theme:{sky:['#5e6f96','#f0b88c'],water:['#3d6481','#081d30'],shore:'#2c3a2e',shore2:'#33463a',shadow:'rgba(5,20,40,0.34)',sun:'sunset'}},
 {id:'frozen',depth:90,dpx:4.5,name:'Frozen Lake',price:2200,emoji:'❄️',desc:'Brrr! Icy water under the glowing northern lights.',wx:{clear:4,snow:4,blizzard:1.2,fog:1},
  theme:{sky:['#070d22','#2a456e'],water:['#2a4f68','#04121e'],shore:'#e9f1f6',shore2:'#b9cfe0',shadow:'rgba(0,10,30,0.38)',sun:'night'}},

function moveLure(nx,ny){
 const L=G.lure,s=Lay.s,seg=10*s;
 nx=clamp(nx,Lay.minX,Lay.maxX);ny=clamp(ny,Lay.waterY+5*s,Lay.WH-4);
 if(blocked(nx,ny)){if(!blocked(nx,L.y))ny=L.y;else if(!blocked(L.x,ny))nx=L.x;else return false;}
 const p=L.path,last=p[p.length-1],max=lureLineMax(),d=Math.hypot(nx-last.x,ny-last.y),cur=Math.hypot(L.x-last.x,L.y-last.y);
 L.atMax=false;
 if(L.base+d>max&&d>cur){const room=max-L.base;L.atMax=true;if(room<=cur)return false;const k=room/d;nx=last.x+(nx-last.x)*k;ny=last.y+(ny-last.y)*k;if(blocked(nx,ny))return false;}

 if(p.length>1){const prev=p[p.length-2];if(Math.hypot(nx-prev.x,ny-prev.y)<seg&&clearSeg(prev,{x:nx,y:ny})){L.base-=Math.hypot(last.x-prev.x,last.y-prev.y);p.pop();}}
 const lp=p[p.length-1],dd=Math.hypot(nx-lp.x,ny-lp.y);if(dd>seg){p.push({x:nx,y:ny});L.base+=dd;}

 else{L.x=last.x;L.y=last.y;dist-=d;if(p.length>1){const prev=p[p.length-2];L.base-=Math.hypot(last.x-prev.x,last.y-prev.y);p.pop();}else{L.done=true;return;}}}}

function updateLure(dt){

function bossStrikes(){
 const L=G.lure,s=Lay.s;if(!G.bosses||!L)return;
 for(const b of G.bosses){const f=b.f,B=b.B;if(f.state!=='boss'||f.hitT>0)continue;
  const dx=(L.x-f.x)*f.dir,dy=L.y-f.y,ex=f.L*0.5,ey=f.bh*0.6+4*s;if(dx*dx/(ex*ex)+dy*dy/(ey*ey)>1)continue;
  const rel=Math.hypot(L.vx-f.vx,L.vy-f.vy);if(rel<70*s)continue;
  f.hitT=0.7;
  if(!bossReady(B)){floatText(f.x,f.y-f.bh,'Your gear is too weak! Needs a '+bossNeeds(B),'#ffb08a');Snd.error();continue;}
  let k=1;
  if(B.move==='armor'&&dx>0){k=0.25;floatText(f.x,f.y-f.bh*1.2,'Armored head! Hit it from behind','#cfd8dc');}
  if(B.move==='breathe')k=b.dazed>0?2:0.45;
  if(b.mode==='recover')k*=1.5;if(b.dazed>0&&B.move!=='breathe')k*=1.5;
  const dmg=Math.max(1,Math.round((7+S.lure*4)*hookStats(S.hook).dmg*clamp(rel/(200*s),0.5,1.6)*(L.dashT>0?1.25:1)*k*0.65));f.hp-=dmg;
  floatText(f.x,f.y-f.bh*0.8,'-'+dmg,k>1?'#ffe08a':'#ffffff');Snd.hit();
  for(let i=0;i<8;i++)G.parts.push({t:'bub',x:L.x,y:L.y,vy:rand(20,70),r:rand(1,3)*s,life:1.2,max:1.2});
  if(f.hp<=0){f.hp=0;b.active=false;G.bossBanner=null;hookFish(f);return;}}
}

// ---------- the fight: reel the weakened fish back along your line ----------
function pullInput(){return G.btnPull||G.dragPull||((G.keys.right?1:0)-(G.keys.left?1:0));}
function hookFish(f){G.hookedFish=f;f.state='hooked';G.hooked=rollCatch(f.sp,f.t);G.hooked.boss=!!f.boss;G.hooked.bossId=f.id;if(f.boss)G.hooked.value*=3;G.holding=false;Snd.bite();
 const rs=rodStats(S.rod),d=f.sp.diff+f.t*1.2+wxMods().diff+(f.boss?4:0),lb=G.hooked.w*2.20462;G.state='reeling';
 G.fight={d,ten:0.3,stam:f.boss?1:0.55,strain:0,idle:0,phase:'rest',pt:rand(0.6,1.2),dir:1,dv:0,str:1,counter:0,pull:0.22+d*0.065,abs:rs.strength*lineStats(S.line).pull,reel:reelStats(S.reel).speed,
  big:clamp(Math.log10(lb+1)/2.6,0,1)*(f.boss?1.25:1),startLen:Math.max(1,lineUsed()),dist:1,clickT:0,dragT:0,eff:0,jumpT:-1,out:0};
 if(G.fight.big>0.45){G.fight.phase='rest';G.fight.pt=0.15;}
 toast(f.boss?'The boss is hooked! Hold on tight.':'Fish on! Reel it in.','gold',1800);}
// the line takes the shortest way back to you around the rocks, so a hooked fish doesn't have to follow your trail
function straighten(){const L=G.lure,p=L.path;while(p.length>=2&&clearSeg(p[p.length-2],{x:L.x,y:L.y})){const a=p[p.length-2],b=p[p.length-1];L.base-=Math.hypot(b.x-a.x,b.y-a.y);p.pop();}}
function updateFight(dt){
 const F=G.fight,L=G.lure,reel=G.holding,pd=pullInput(),s=Lay.s,f=G.hookedFish,ls=lineStats(S.line);
 F.pt-=dt;
 if(F.pt<=0){if(F.phase==='rest'){F.phase='run';F.dir=Math.random()<0.5?-1:1;F.dv=rand(-0.35,0.6);F.str=rand(0.8,1.15)*(0.55+0.45*F.stam);F.pt=rand(0.9,1.8)*(0.6+0.6*F.stam)*(1+F.big);Snd.zip();}
  else{F.phase='rest';F.pt=(rand(1.0,2.0)+(1-F.stam)*2.2)/(1+F.d*0.04);}}
 const run=F.phase==='run',want=run?(pd===-F.dir?1:pd===F.dir?-0.6:0):0;F.counter+=(want-F.counter)*Math.min(1,dt*7);
 let eff=F.pull*(0.3+0.7*F.stam)*F.abs*(run?F.str:0.22);if(run)eff*=1-0.55*Math.max(0,F.counter)+0.4*Math.max(0,-F.counter);F.eff=eff;
 // big fish run hard enough to pull line off the reel; a better reel (drag) slows them down
 const pay=run?(40+520*F.big)*s*F.str*(1-0.45*Math.max(0,F.counter))*(0.4+0.6*F.stam)/reelStats(S.reel).drag:0;
 if(pay>0){const before=lineUsed();if(!moveLure(L.x+F.dir*pay*dt,L.y+F.dv*pay*0.6*dt)&&!L.atMax){F.dir*=-1;F.dv=-F.dv;}
  F.out+=Math.max(0,lineUsed()-before);F.dragT-=dt;if(F.dragT<=0){F.dragT=0.05;Snd.drag();}}
 let tT=reel?0.3+eff+(run?0.5*F.big:0):0.12+eff*0.5;if(L.atMax&&run)tT+=0.45;
 F.ten+=(tT-F.ten)*Math.min(1,dt*(tT>F.ten?6:4));
 if(F.ten>0.9)F.strain+=dt*(1+(F.ten-0.9)*8)/ls.snap;else F.strain=Math.max(0,F.strain-dt*0.8);
 if(F.strain>=1&&!S.god){escapeFish(L.atMax?'spool':'snap');return;}
 const effN=clamp(eff,0,1.1);
 if(reel){retract(dt*125*s*F.reel*Math.max(0.05,1.1-0.85*effN)*(1+0.6*(1-F.stam))/(1+F.d*0.12)/(1+F.big*1.8)*(run?0.2:1));F.idle=0;F.clickT-=dt;if(F.clickT<=0){F.clickT=0.08;Snd.tick();}}
 else F.idle=run?Math.max(0,F.idle-dt):F.idle+dt;
 if(F.idle>hookStats(S.hook).hold&&!S.god){escapeFish('shake');return;}
 const drain=run?0.14*(0.5+0.5*Math.max(0,F.counter)+(reel?0.3:0)):(reel?0.03:-0.015);
 F.stam=clamp(F.stam-drain*dt/(1+F.d*0.075),0,1);
 if(!L.done)straighten();
 F.dist=clamp(lineUsed()/F.startLen,0,1);
 const toward=L.path[L.path.length-1],fd=run?F.dir:(toward.x<L.x?-1:1);f.dir=fd;f.x=L.x-fd*f.L*0.45;f.y=L.y;
 if(Math.random()<dt*(run?6:2))G.parts.push({t:'bub',x:L.x,y:L.y,vy:rand(40,80),r:rand(2,4)*s,life:2,max:2});
 if(L.done)startLanding();
}// ---------- landing: grab the fish by the lip at the side of the boat ----------
function startLanding(){
 const F=G.fight,h=G.hooked;G.state='landing';G.holding=false;G.parts=[];
 G.land={t:0,tries:Math.max(1,gloveStats(S.gloves).tries-(h.boss?2:0)),wild:0.3+0.7*F.stam,d:F.d,missT:0,grabT:-1,cm:lenCm(h.sp,h.w),hand:{x:W*0.8,y:H*0.3},msg:'',msgT:0};
 Snd.splash();
}
function landGeom(){
 const Ld=G.land,sp=G.hooked.sp,p=fishP(sp),s=Lay.s,ext=(p.bill||0)*0.8,surf=H*0.6;
 const ppc=Math.min(5*s,W*0.55/Ld.cm,H*1.3/Ld.cm),L=Ld.cm*ppc/(1.06+ext);
 const hs=clamp(ppc*9/38,0.42,1.25),R=Math.max(16,(34-Ld.d*1.6)*s)*(Ld.d<3?1.3:1)*gloveStats(S.gloves).ring;
 if(Ld.grabT>=0){const u=ease(clamp(Ld.grabT/0.9,0,1)),ty=clamp(H*0.5-L*0.55,56*s,H*0.35);
  return {mx:lerp(Ld.gx,W*0.5,u),my:lerp(Ld.gy,ty,u),ang:lerp(Ld.gAng,-Math.PI/2,u),wig:Math.sin(Ld.t*12)*0.35*(1-u*0.6),L,R,hs,surf};}
 const t=Ld.t,burst=0.35+0.65*(0.5+0.5*Math.sin(t*1.25)),A=Ld.wild*burst*(Ld.missT>0?1.6:1);
 return {mx:W*0.6+(Math.sin(t*2.7)*0.6+Math.sin(t*6.1+1)*0.4)*A*70*s,my:surf-4*s+(Math.sin(t*3.6+2)*0.6+Math.sin(t*7.3)*0.4)*A*30*s,
  ang:-0.16+Math.sin(t*(4+Ld.d*0.3))*A*0.3,wig:Math.sin(t*14)*(0.15+A*0.8),L,R,hs,surf};
}
function landSplash(x,y,n){for(let i=0;i<n;i++)G.parts.push({t:'drop',x:x+rand(-20,20)*Lay.s,y,vx:rand(-90,90),vy:rand(-220,-80),life:0.9,max:0.9,r:rand(2,4)*Lay.s,surf:y});}
function tryGrab(){
 const Ld=G.land;if(!Ld||Ld.grabT>=0)return;
 const g=landGeom(),d=Math.hypot(Ld.hand.x-g.mx,Ld.hand.y-g.my);
 if(d<=g.R*1.25){Ld.grabT=0;Ld.gx=g.mx;Ld.gy=g.my;Ld.gAng=g.ang;Snd.grab();landSplash(g.mx,g.surf,18);}
 else{Ld.tries--;Ld.missT=0.9;Snd.error();landSplash(g.mx,g.surf,10);
  if(Ld.tries<=0)escapeFish('boat');else{Ld.msg='Missed! '+Ld.tries+(Ld.tries>1?' tries':' try')+' left';Ld.msgT=1.6;}}
}
function updateLanding(dt){
 const Ld=G.land;Ld.t+=dt;Ld.missT=Math.max(0,Ld.missT-dt);Ld.msgT=Math.max(0,Ld.msgT-dt);
 if(G.aim){const k=Math.min(1,dt*14);Ld.hand.x+=(G.aim.x-Ld.hand.x)*k;Ld.hand.y+=(G.aim.y-Ld.hand.y)*k;}
 Ld.hand.x=clamp(Ld.hand.x,10,W-10);Ld.hand.y=clamp(Ld.hand.y,10,H-10);
 if(Ld.grabT>=0){Ld.grabT+=dt;const g=landGeom();
  if(Math.random()<dt*14)G.parts.push({t:'drop',x:g.mx+rand(-8,8)*Lay.s,y:g.my+rand(0.2,0.9)*g.L,vx:rand(-15,15),vy:rand(0,40),life:1.2,max:1.2,r:rand(1.5,3)*Lay.s,surf:g.surf});
  if(Ld.grabT>=1.3)catchFish();}
 else if(Math.random()<dt*(2+Ld.wild*6)){const g=landGeom();landSplash(g.mx-g.L*rand(0.2,0.8),g.surf,3);}
}
function catchFish(){
 const h=G.hooked,id=h.sp.id,prev=S.log[id],isNew=!prev,record=!isNew&&h.w>prev.best;
 if(G.hookedFish){const i=G.swim.indexOf(G.hookedFish);if(i>=0)G.swim.splice(i,1);G.hookedFish=null;}
 S.log[id]={count:(prev?prev.count:0)+1,best:Math.max(prev?prev.best:0,h.w)};
 S.fish.push({id,w:h.w,v:h.value});S.caught++;
 if(h.boss){const bid=h.bossId;S.trophies[bid]=(S.trophies[bid]||0)+1;G.bossDone[bid]=true;G.bosses=(G.bosses||[]).filter(b=>b.id!==bid);}
 if(!S.won&&Object.keys(S.log).length>=FISH.length){S.won=true;G.pendingWin=true;}
 save();
 G.state='caught';G.holding=false;G.fight=null;G.land=null;G.lure=null;G.parts=[];
 if(isNew)Snd.newFish();else Snd.catch();
 showCatchCard(h,isNew,record);updateHUD();
}
function releaseHooked(){const f=G.hookedFish;if(f){if(f.boss){f.state='boss';f.hp=Math.round(f.maxHp*0.35);}else{f.state='swim';f.fleeT=3;f.hp=Math.round(f.maxHp*0.5);}}G.hookedFish=null;}
function escapeFish(reason){
 const h=G.hooked,L=G.lure;G.state='escaped';G.escT=2.6;S.escaped++;save();releaseHooked();G.fight=null;G.land=null;G.holding=false;
 const r=h.sp.rarity,n=(r==='legendary'?'LEGENDARY ':r==='rare'?'rare ':'')+h.sp.name;
 G.escMsg=reason==='snap'?'Snap! The line broke and the '+n+' got away with your lure. Let go of the reel when the line turns red.':
  reason==='spool'?'The '+n+' pulled all the line off your reel! A better reel and a longer-line rod help with big fish.':
  reason==='shake'?'The '+n+' threw the hook. Keep reeling when it rests.':
  reason==='boat'?'The '+n+' wiggled out of your hand at the boat. So close!':'The '+n+' got away.';
 if(reason==='snap')Snd.snap();else Snd.escape();
 if(L&&reason!=='boat')G.parts.push({t:'bub',x:L.x,y:L.y,vy:60,r:4,life:1.5,max:1.5});
 G.lure=null;
}

function wxMods(){const f=WXFX[WX.type]||WXFX.clear,td=tod(),th=curLoc().theme.sun;
 const night=th==='night'?1:td.night,gold=th==='sunset'?0.6:td.gold;
 return {bite:f.bite*(1+0.3*gold),rare:f.rare,leg:f.leg*(1+0.4*night),diff:f.diff,tip:f.tip,gold,night};}
function clockStr(){const h=Math.floor(G.clock),m=Math.floor((G.clock-h)*4)*15;return ((h+11)%12+1)+':'+String(m).padStart(2,'0')+(h<12?' AM':' PM');}
function sunPos(){const td=tod(),fr=(G.clock-6)/12;return {x:W*(0.06+0.88*fr),y:Lay.waterY*(1.02-0.8*Math.max(0,td.e)),up:td.e>-0.15};}
function rollWeather(announce){
 const o=curLoc().wx;let tot=0,pick='clear';for(const k in o)tot+=o[k];
 for(let n=0;n<3;n++){let r=Math.random()*tot;for(const k in o){r-=o[k];if(r<=0){pick=k;break;}}if(pick!==WX.type)break;}
 const changed=pick!==WX.type;WX.type=pick;WX.t=0;WX.dur=rand(70,150);
 if(!announce){const tg=WXT[pick];for(const q in WX.cur)WX.cur[q]=tg[q];}
 else if(changed){const w=WXT[pick];toast(w.e+' '+w.n+'! '+WXFX[pick].tip,'',3800);}
}
function initPrecip(){
 WX.rain=[];for(let i=0;i<260;i++)WX.rain.push({x:Math.random()*(W+260)-60,y:Math.random()*Lay.waterY,v:rand(650,950),l:rand(9,17)});
 WX.flakes=[];for(let i=0;i<180;i++)WX.flakes.push({x:Math.random()*W,y:Math.random()*Lay.waterY,v:rand(25,70),r:rand(1,2.8),ph:Math.random()*6});
}
function lightning(){const x=rand(W*0.15,W*0.9),pts=[[x,0]];let y=0,cx=x;while(y<Lay.waterY*0.85){y+=rand(14,30);cx+=rand(-22,22);pts.push([cx,y]);}
 WX.bolt={pts,life:0.3};WX.flash=1;setTimeout(()=>Snd.thunder(),rand(250,1100));}
function updateWeather(dt){
 WX.t+=dt;if(WX.t>WX.dur&&G.state!=='reeling'&&G.state!=='landing'&&G.state!=='sailing')rollWeather(true);
 const tg=WXT[WX.type],c=WX.cur,k=Math.min(1,dt*0.35);for(const q in c)c[q]+=(tg[q]-c[q])*k;
 G.clock=(G.clock+dt*0.05)%24;
 if(WX.type==='storm'&&G.state!=='sailing'){WX.boltT-=dt;if(WX.boltT<=0){WX.boltT=rand(5,13);lightning();}}
 WX.flash=Math.max(0,WX.flash-dt*2.5);if(WX.bolt){WX.bolt.life-=dt;if(WX.bolt.life<=0)WX.bolt=null;}
 const wy=Lay.waterY;
 if(c.rain>0.02){const n=Math.round(WX.rain.length*c.rain);
  for(let i=0;i<n;i++){const d=WX.rain[i];d.y+=d.v*dt;d.x-=d.v*dt*(0.15+c.wind*0.35);if(d.y>wy||d.x<-60){d.y=rand(-40,0);d.x=Math.random()*(W+260)-60;}}
  if(Math.random()<dt*c.rain*40)G.parts.push({t:'ring',x:rand(0,W),y:wy+rand(0,3),life:0.5,max:0.5,r:1.5});
  WX.rainSndT-=dt;if(WX.rainSndT<=0){WX.rainSndT=1.4;Snd.rain(c.rain);}}
 if(c.snow>0.02){const n=Math.round(WX.flakes.length*c.snow);
  for(let i=0;i<n;i++){const f=WX.flakes[i];f.y+=f.v*(1+c.wind)*dt;f.x+=(Math.sin(G.time+f.ph)*15-c.wind*110)*dt;if(f.y>wy){f.y=-5;f.x=Math.random()*(W+200);}if(f.x<-10)f.x=W+10;}}
}

// ---------- main update ----------
function update(dt){
 updateWeather(dt);
 if(G.aimS)G.aimW={x:G.aimS.x+CAM.x,y:G.aimS.y+CAM.y};
 switch(G.state){
  case 'casting':G.castT+=dt/0.6;if(G.castT>=1)enterWater();break;
  case 'lure':updateLure(dt);break;
  case 'reeling':if(G.lure&&G.fight&&G.hookedFish)updateFight(dt);else{G.state='idle';G.fight=null;G.lure=null;}break;
  case 'landing':updateLanding(dt);break;
  case 'escaped':G.escT-=dt;if(G.escT<=0)G.state='idle';break;
  case 'sailing':updateSail(dt);break;
 }
 if(G.flash>0)G.flash-=dt;
 G.shake=Math.max(0,(G.shake||0)-dt);updateWalk(dt);updateBosses(dt);updateSwimmers(dt);updateParticles(dt);updateCamera(dt);
}
function rgbaC(c,a){return 'rgba('+col2rgb(c).join(',')+','+a+')';}
// ---------- drawing: scenery ----------
// Static scenery (land, forests, mountains, the lake bed) is painted once per place into off-screen canvases.
const sceneCache={key:'',far:null,bed:null,bedY:0};
function mkCanvas(w,h){const c=document.createElement('canvas');c.width=Math.max(1,Math.ceil(w*DPR));c.height=Math.max(1,Math.ceil(h*DPR));const x=c.getContext('2d');x.scale(DPR,DPR);return {c,x,w,h};}
function ridge(seed,n,rough){const r=srand(seed),a=new Array(n+1).fill(0);a[0]=r()*2-1;a[n]=r()*2-1;let step=n,sc=1;
 while(step>1){const half=step/2;for(let i=half;i<n;i+=step)a[i]=(a[i-half]+a[i+half])/2+(r()*2-1)*sc;step=half;sc*=rough;}return a;}
function fillRidge(x,seed,baseY,top,amp,rough,c1,c2){const a=ridge(seed,256,rough),g=x.createLinearGradient(0,top-amp,0,baseY);g.addColorStop(0,c1);g.addColorStop(1,c2);
 x.fillStyle=g;x.beginPath();x.moveTo(0,baseY);for(let i=0;i<=256;i++)x.lineTo(i/256*W,top-a[i]*amp);x.lineTo(W,baseY);x.closePath();x.fill();return a;}
function mountains(x,seed,baseY,top,amp,rock,snowLine,haze){
 const a=ridge(seed,256,0.58),n=256,ys=a.map(v=>top-v*amp);
 const dark=shade(rock,-0.35),lite=shade(rock,0.28),sw=W/n;
 for(let i=0;i<n;i++){const slope=(ys[i+1]-ys[i])/sw,k=clamp(0.5+slope*0.9,0,1),px=i*sw,y0=Math.min(ys[i],ys[i+1]);
  const g=x.createLinearGradient(0,y0,0,baseY);g.addColorStop(0,mixC(dark,lite,k));g.addColorStop(1,mixC(rock,haze,0.55));x.fillStyle=g;x.fillRect(px,y0,sw+0.6,baseY-y0);
  if(snowLine!=null&&y0<snowLine){const r=srand(seed+i)(),sb=Math.min(baseY,snowLine+(r-0.5)*amp*0.25+Math.sin(i*0.7)*amp*0.05);x.fillStyle=mixC('#c9d6e2','#ffffff',k);x.fillRect(px,y0,sw+0.6,Math.max(0,sb-y0));}}
 // trim everything above the ridge line
 x.save();x.globalCompositeOperation='destination-out';x.beginPath();x.moveTo(0,0);for(let i=0;i<=n;i++)x.lineTo(i*sw,ys[i]);x.lineTo(W,0);x.closePath();x.fill();x.restore();
 const hz=x.createLinearGradient(0,top,0,baseY);hz.addColorStop(0,'rgba(0,0,0,0)');hz.addColorStop(1,rgbaC(haze,0.55));x.fillStyle=hz;x.fillRect(0,top-amp,W,baseY-top+amp);
}
function conifers(x,seed,baseY,hMin,hMax,col,snow,step){const r=srand(seed);let px=-10;
 while(px<W+10){const h=hMin+r()*(hMax-hMin),w=h*(0.28+r()*0.08),c=mixC(col,'#000000',r()*0.25);x.fillStyle=c;x.beginPath();x.moveTo(px,baseY-h);
  const layers=6;for(let k=1;k<=layers;k++){const t=k/layers;x.lineTo(px+w*t*0.5+w*0.06,baseY-h+h*t*0.92-h*0.04);x.lineTo(px+w*t*0.36,baseY-h+h*t*0.92);}
  x.lineTo(px+w*0.05,baseY);x.lineTo(px-w*0.05,baseY);
  for(let k=layers;k>=1;k--){const t=k/layers;x.lineTo(px-w*t*0.36,baseY-h+h*t*0.92);x.lineTo(px-w*t*0.5-w*0.06,baseY-h+h*t*0.92-h*0.04);}
  x.closePath();x.fill();
  if(snow){x.fillStyle='rgba(240,246,250,0.85)';for(let k=1;k<=6;k++){const t=k/6,yy=baseY-h+h*t*0.92-h*0.05;x.fillRect(px-w*t*0.42,yy,w*t*0.84,Math.max(1,h*0.025));}}
  px+=(step||3)+r()*(step||3);}}
function canopy(x,seed,baseY,h,col){const r=srand(seed);
 for(let pass=0;pass<3;pass++){let px=-20;while(px<W+20){const rad=(0.18+r()*0.22)*h,yy=baseY-h*(0.35+r()*0.5)+pass*h*0.06;
  x.fillStyle=pass===0?shade(col,-0.25):pass===1?col:shade(col,0.12);x.globalAlpha=pass===2?0.5:1;x.beginPath();x.arc(px,yy,rad*(pass===2?0.6:1),0,7);x.fill();px+=rad*(0.7+r()*0.6);}}
 x.globalAlpha=1;x.fillStyle=shade(col,-0.25);x.fillRect(0,baseY-h*0.35,W,h*0.35);}
function palmSil(x,px,by,h,col){x.strokeStyle=col;x.lineWidth=h*0.045;x.lineCap='round';const tx=px+h*0.2,ty=by-h;x.beginPath();x.moveTo(px,by);x.quadraticCurveTo(px,by-h*0.6,tx,ty);x.stroke();
 x.lineWidth=h*0.035;for(let i=0;i<8;i++){const a=-Math.PI/2+(i-3.5)*0.42;x.beginPath();x.moveTo(tx,ty);x.quadraticCurveTo(tx+Math.cos(a)*h*0.28,ty+Math.sin(a)*h*0.28-h*0.06,tx+Math.cos(a)*h*0.46,ty+Math.sin(a)*h*0.46+h*0.16);x.stroke();}}
function paintFar(x){
 const id=S.loc,th=curLoc().theme,wy=Lay.waterY,haze=th.sky[1],s=Lay.s;
 if(id==='pond'){fillRidge(x,11,wy,wy*0.8,wy*0.06,0.55,mixC('#7d9585',haze,0.5),mixC('#6d8a6b',haze,0.35));
  canopy(x,12,wy-wy*0.04,wy*0.17,'#5b7a4a');x.fillStyle='rgba(200,215,225,0.25)';x.fillRect(0,wy*0.7,W,wy*0.3);canopy(x,13,wy-2,wy*0.12,'#3f5f32');
  const bx=W*0.8,by=wy-4*s;x.fillStyle='#7a2e24';x.fillRect(bx,by-22*s,34*s,22*s);x.fillStyle='#4a4a48';x.beginPath();x.moveTo(bx-3*s,by-22*s);x.lineTo(bx+17*s,by-34*s);x.lineTo(bx+37*s,by-22*s);x.fill();x.fillStyle='#e8e2d4';x.fillRect(bx+13*s,by-14*s,8*s,14*s);
  x.fillStyle='#55703a';x.fillRect(0,wy-4,W,5);}
 else if(id==='river'){fillRidge(x,21,wy,wy*0.62,wy*0.12,0.55,mixC('#6d8794',haze,0.45),mixC('#5c7a6a',haze,0.35));
  conifers(x,22,wy-wy*0.05,wy*0.12,wy*0.2,mixC('#2f4a3a',haze,0.35),false,3);conifers(x,23,wy-2,wy*0.16,wy*0.28,'#1f3527',false,4);
  const r=srand(24);for(let i=0;i<40;i++){const px=r()*W,rd=(3+r()*7)*s,rg=x.createRadialGradient(px-rd*0.3,wy-rd*0.5,1,px,wy-2,rd);rg.addColorStop(0,'#a9adab');rg.addColorStop(1,'#5b605f');x.fillStyle=rg;x.beginPath();x.ellipse(px,wy-1,rd,rd*0.55,0,Math.PI,0);x.fill();}}
 else if(id==='lake'){mountains(x,31,wy,wy*0.5,wy*0.36,'#6b6177',wy*0.42,mixC(haze,'#c9a9a0',0.3));
  conifers(x,32,wy-3,wy*0.06,wy*0.13,'#273a33',false,2.5);x.fillStyle='#2c3a2e';x.fillRect(0,wy-3,W,4);}
 else if(id==='frozen'){mountains(x,41,wy,wy*0.55,wy*0.3,'#5d7189',wy*0.7,mixC(haze,'#8fb0cf',0.4));
  conifers(x,42,wy-4,wy*0.08,wy*0.16,'#1d3a36',true,3);x.fillStyle='#e9f1f6';x.fillRect(0,wy-5,W,6);x.fillStyle='rgba(160,190,215,0.6)';x.fillRect(0,wy-1,W,1.5);}
 else if(id==='trinity'){fillRidge(x,61,wy,wy*0.86,wy*0.03,0.5,mixC('#9aa57a',haze,0.55),mixC('#8a9a6a',haze,0.4));canopy(x,62,wy-wy*0.02,wy*0.15,'#5f7d3c');
  const bx0=W*0.08,bx1=W*0.55,by=wy-wy*0.2;x.fillStyle=mixC('#8b8f93',haze,0.45);x.fillRect(bx0,by,bx1-bx0,wy*0.025);for(let i=0;i<=6;i++){const px=bx0+(bx1-bx0)*i/6;x.fillRect(px-2*s,by,4*s,wy*0.2);}
  x.fillStyle='#8a7a52';x.fillRect(0,wy-5,W,6);}
 else if(id==='amazon'){fillRidge(x,51,wy,wy*0.72,wy*0.05,0.5,mixC('#5f7d5a',haze,0.55),mixC('#4f6e48',haze,0.4));canopy(x,52,wy-wy*0.03,wy*0.26,'#3d5e2e');
  const r=srand(54);for(let i=0;i<7;i++){const px=r()*W,hh=wy*(0.3+r()*0.12);x.fillStyle='#4a3b2a';x.fillRect(px-2*s,wy-hh,4*s,hh);x.fillStyle=i%2?'#355428':'#41632f';x.beginPath();x.ellipse(px,wy-hh,22*s+r()*14*s,9*s,0,0,7);x.fill();}
  canopy(x,53,wy-2,wy*0.15,'#2c4a22');x.fillStyle='#5a4630';x.fillRect(0,wy-4,W,5);}
 else if(id==='reef'){const ix=W*0.74;x.fillStyle=mixC('#4e7f58',haze,0.25);x.beginPath();x.moveTo(ix-130*s,wy);x.quadraticCurveTo(ix-40*s,wy-34*s,ix+30*s,wy-26*s);x.quadraticCurveTo(ix+100*s,wy-18*s,ix+140*s,wy);x.fill();
  const sg=x.createLinearGradient(0,wy-6*s,0,wy);sg.addColorStop(0,'#efe0b8');sg.addColorStop(1,'#cdb98b');x.fillStyle=sg;x.beginPath();x.ellipse(ix,wy,150*s,7*s,0,Math.PI,0);x.fill();
  for(const [dx,hh] of [[-60,52],[-30,64],[10,48],[55,58],[85,40]])palmSil(x,ix+dx*s,wy-4*s,hh*s,mixC('#2d4a30',haze,0.15));}
 else if(id==='deep'){x.fillStyle=mixC(haze,'#5f7d99',0.35);x.fillRect(0,wy-2,W,2);const sx=W*0.7;x.fillStyle=mixC('#3e4a56',haze,0.5);
  x.beginPath();x.moveTo(sx,wy-2);x.lineTo(sx+70*s,wy-2);x.lineTo(sx+64*s,wy-8*s);x.lineTo(sx+4*s,wy-8*s);x.closePath();x.fill();x.fillRect(sx+12*s,wy-15*s,16*s,7*s);x.fillRect(sx+18*s,wy-22*s,3*s,7*s);}
}
function paintBed(x,y0){
 const id=S.loc,s=Lay.s,by=Lay.colBot+14*s;
 const bed={pond:'#5a4a33',river:'#6e6c62',lake:'#3f3b31',frozen:'#4f6272',reef:'#d9c592',deep:'#151b25'}[id];
 x.save();x.translate(0,-y0);
 const g=x.createLinearGradient(0,by-12*s,0,H);g.addColorStop(0,shade(bed,0.1));g.addColorStop(1,shade(bed,-0.45));x.fillStyle=g;
 x.beginPath();x.moveTo(0,H);for(let px=0;px<=W+10;px+=10)x.lineTo(px,by+Math.sin(px*0.018)*5*s+Math.sin(px*0.05+1)*3*s);x.lineTo(W,H);x.closePath();x.fill();
 x.save();x.clip();const r=srand(55);for(let i=0;i<W*3;i++){const px=r()*W,py=by-8*s+r()*(H-by+8*s);x.fillStyle=r()<0.5?'rgba(255,255,255,0.07)':'rgba(0,0,0,0.12)';x.fillRect(px,py,1+r()*2,1+r()*1.5);}x.restore();
 const rock=(px,py,rd,col)=>{const rg=x.createRadialGradient(px-rd*0.35,py-rd*0.45,rd*0.1,px,py,rd*1.1);rg.addColorStop(0,shade(col,0.22));rg.addColorStop(1,shade(col,-0.4));x.fillStyle=rg;x.beginPath();x.ellipse(px,py,rd,rd*0.6,0,Math.PI,0);x.fill();};
 const r2=srand(66),rc={pond:'#6e6250',river:'#83888a',lake:'#555046',frozen:'#6c8193',reef:'#bfae86',deep:'#232b38'}[id];
 for(let i=0;i<(id==='river'?30:14);i++)rock(r2()*W,by+3*s,(4+r2()*(id==='river'?14:10))*s,rc);
 if(id==='lake'){const lx=W*0.56;x.fillStyle='#3b2c20';x.save();x.translate(lx,by-6*s);x.rotate(-0.04);rr(x,0,-7*s,120*s,14*s,7*s);x.fill();x.strokeStyle='rgba(0,0,0,0.3)';x.lineWidth=1;for(let k=0;k<4;k++){x.beginPath();x.moveTo(6*s,-4*s+k*3*s);x.lineTo(112*s,-4*s+k*3*s);x.stroke();}x.restore();}
 if(id==='reef'){const cols=['#c46a6a','#d89a5a','#9a6aa8','#5aa9a8','#d07a5e','#b8607d'],r3=srand(77);
  for(let i=0;i<14;i++){const px=W*(i/13)+(r3()-0.5)*30*s,hh=(24+r3()*34)*s,cc=mixC(cols[i%cols.length],'#7a8a8a',0.25);
   if(i%3===0){x.strokeStyle=cc;x.lineCap='round';for(let k=0;k<7;k++){const a=-Math.PI/2+(r3()-0.5)*1.4;x.lineWidth=(2+r3()*3)*s;x.beginPath();x.moveTo(px,by);x.quadraticCurveTo(px+Math.cos(a)*hh*0.4,by+Math.sin(a)*hh*0.5,px+Math.cos(a)*hh,by+Math.sin(a)*hh);x.stroke();}}
   else if(i%3===1){const rg=x.createRadialGradient(px-hh*0.15,by-hh*0.45,2,px,by-hh*0.2,hh*0.6);rg.addColorStop(0,shade(cc,0.2));rg.addColorStop(1,shade(cc,-0.35));x.fillStyle=rg;x.beginPath();x.ellipse(px,by-hh*0.2,hh*0.5,hh*0.38,0,Math.PI,0);x.fill();
    x.strokeStyle='rgba(0,0,0,0.18)';x.lineWidth=1;for(let k=0;k<6;k++){x.beginPath();x.ellipse(px,by-hh*0.2,hh*(0.08+k*0.07),hh*(0.06+k*0.05),0,Math.PI,0);x.stroke();}}
   else{x.fillStyle=cc;x.globalAlpha=0.85;x.beginPath();x.moveTo(px-hh*0.3,by);for(let k=0;k<=10;k++){const t=k/10;x.lineTo(px-hh*0.3+t*hh*0.6,by-hh*(0.5+0.5*Math.sin(t*Math.PI))*(0.8+r3()*0.3));}x.lineTo(px+hh*0.3,by);x.fill();x.globalAlpha=1;}}}
 if(id==='deep'){x.fillStyle='#0d121a';const r4=srand(88);for(let i=0;i<6;i++){const px=W*(i/5)+(r4()-0.5)*60*s;x.beginPath();x.moveTo(px-70*s,by+12*s);x.lineTo(px-14*s,by-40*s-r4()*40*s);x.lineTo(px+8*s,by-30*s-r4()*30*s);x.lineTo(px+60*s,by+12*s);x.fill();}}
 x.restore();
}
function buildScene(){const key=S.loc+'|'+W+'|'+H+'|'+DPR;if(sceneCache.key===key)return;sceneCache.key=key;
 const f=mkCanvas(W,Lay.waterY+2);paintFar(f.x);sceneCache.far=f;
 }
// soft cumulus clouds, painted once
const cloudSprites={light:[],dark:[]};
function cloudSprite(seed,dark){const w=420,h=170,c=document.createElement('canvas');c.width=w;c.height=h;const x=c.getContext('2d'),r=srand(seed*97+11);
 for(let i=0;i<46;i++){const t=r(),px=w*(0.1+0.8*t),bulge=1-Math.abs(t-0.5)*1.5,py=h*0.62-r()*h*0.42*bulge,rad=(16+r()*34)*(0.5+bulge*0.7);
  const g=x.createRadialGradient(px,py,rad*0.15,px,py,rad);g.addColorStop(0,dark?'rgba(110,118,128,0.55)':'rgba(255,255,255,0.55)');g.addColorStop(1,'rgba(255,255,255,0)');x.fillStyle=g;x.beginPath();x.arc(px,py,rad,0,7);x.fill();}
 x.globalCompositeOperation='source-atop';const sg=x.createLinearGradient(0,h*0.15,0,h*0.8);
 sg.addColorStop(0,dark?'rgba(140,148,158,0.2)':'rgba(255,255,255,0)');sg.addColorStop(1,dark?'rgba(30,36,44,0.9)':'rgba(140,155,172,0.8)');x.fillStyle=sg;x.fillRect(0,0,w,h);return c;}
function skyCols(){const th=curLoc().theme,td=tod(),c=WX.cur;let a=th.sky[0],b=th.sky[1];

function gearDesc(key,i){switch(key){
 case 'rod':{const b=rodStats(i);return 'Holds '+fmtM(b.line)+' of line. Soaks up '+Math.round((1-b.strength)*100)+'% of a fish’s pull.';}
 case 'reel':{const b=reelStats(i);return i?'Reels in '+Math.round((b.speed-1)*100)+'% faster. Big fish pull '+Math.round((1-1/b.drag)*100)+'% less line off your reel.':'A basic reel. Big fish pull line off it easily.';}
 case 'line':return i?'Takes '+Math.round((lineStats(i).snap-1)*100)+'% more strain before it snaps, and holds up better against boss charges.':'Thin starter line. It snaps easily.';
 case 'hook':{const b=hookStats(i);return (i?'Strikes hit '+Math.round((b.dmg-1)*100)+'% harder. ':'A basic hook. ')+'A fish stays hooked for '+b.hold.toFixed(1)+' seconds if you stop reeling.'}
 case 'lure':{const b=lureStats(i);if(!i)return 'A simple soft bait. Upgrade it to hurt tougher fish.';return 'Rare fish ×'+b.rare.toFixed(1)+', legendary fish ×'+b.leg.toFixed(1)+'. Stronger lures can hurt tougher fish.';}
 case 'sinker':return i?'Your lure swims '+Math.round((sinkerStats(i).spd-1)*100)+'% faster.':'A tiny weight. Your lure swims at normal speed.';
 case 'light':return i?'Lights up '+Math.round((lightStats(i).r/150-1)*100)+'% more dark water around your lure.':'Deep water is dark. A light helps you see.';
 case 'sonar':return ['No map of the water yet.','Shows a map of the caves and your lure.','Also shows every fish on the map.','Shows fish colored by rarity.','A bigger live map with fish, rarity and boss lairs.'][i];
 case 'gloves':{const b=gloveStats(i);return (i?'The grab ring is '+Math.round((b.ring-1)*100)+'% bigger. ':'')+'You get '+b.tries+' tries to lip a fish.';}
 case 'scent':return i?'Pulls fish within '+Math.round(scentStats(i).r/10)+' m of your lure toward it, and more fish show up.':'No scent. Fish only notice your lure up close.';
 case 'repel':return i?'Fish under '+REPEL_LB[i]+' lb can’t be caught, so you only land the big ones'+(S.repelOn===false?' (switched off).':'.'):'No repellent. You can catch fish of any size.';
 case 'bucket':return 'Holds '+BUCKETS[i].cap+' fish.';}}

function sellIdx(i){const f=S.fish[i];if(!f)return;S.fish.splice(i,1);S.money+=f.v;S.earned+=f.v;save();Snd.coin();toast('+'+fmt(f.v)+' 💰','gold',1400);updateHUD();renderPanel();}
function sellAll(){if(!S.fish.length)return;const t=S.fish.reduce((a,f)=>a+f.v,0),n=S.fish.length;S.fish=[];S.money+=t;S.earned+=t;save();
 Snd.coin();setTimeout(()=>Snd.coin(),120);toast('Sold '+n+' fish for '+fmt(t)+'! 💰','gold');updateHUD();renderPanel();}
function feedCustomer(){const o=S.order;if(!o)return;let bi=-1;S.fish.forEach((f,i)=>{if(f.id===o.id&&(bi<0||f.v>S.fish[bi].v))bi=i;});if(bi<0)return;
 const f=S.fish.splice(bi,1)[0],pay=f.v*ORDER_BONUS,c=CUSTOMERS[o.c];S.money+=pay;S.earned+=pay;S.served++;newOrder();save();
 Snd.coin();setTimeout(()=>Snd.buy(),150);confetti(25);toast(c.e+' '+c.name.split(' ')[0]+' says THANK YOU! +'+fmt(pay),'gold',3000);updateHUD();renderPanel();}
function doReset(){try{localStorage.removeItem(KEY);}catch(e){}S=defaults();S.seenHelp=true;newOrder();save();G.state='idle';G.sail=null;G.parts=[];G.hooked=null;moneyShown=-1;initAmbient();updateHUD();closePanel();toast('New game started! Good luck! 🎣','good');}

body.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const a=b.dataset.act;
 if(a==='sell')sellIdx(+b.dataset.i);else if(a==='sellall')sellAll();else if(a==='feed')feedCustomer();else if(a==='buy')buy(b.dataset.kind);
 else if(a==='go')travelTo(b.dataset.id);else if(a==='ticket')buyTicket(b.dataset.id);else if(a==='close')closePanel();
 else if(a==='askreset'){curPanel='reset';renderPanel();}else if(a==='doreset')doReset();else if(a==='help'){curPanel='help';renderPanel();}
 else if(a==='mute'){toggleMute();renderPanel();}
 else if(a==='adm')adminCmd(b.dataset.cmd);
 else if(a==='repeltoggle'){S.repelOn=S.repelOn===false;save();Snd.click();renderPanel();}});
body.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='admForm')checkAdminCode();});
$('adminBtn').addEventListener('click',e=>{e.currentTarget.blur();openPanel('admin');setTimeout(()=>{const i=$('admCode');if(i)i.focus();},60);});
$('closeBtn').addEventListener('click',closePanel);
modal.addEventListener('pointerdown',e=>{if(e.target===modal)closePanel();});
$('ccOk').addEventListener('click',()=>{closeCatchCard();});
$('catchCard').addEventListener('pointerdown',e=>{if(e.target===$('catchCard')&&performance.now()-G.cardT>450)closeCatchCard();});
document.querySelectorAll('#toolbar button').forEach(b=>b.addEventListener('click',()=>{b.blur();openPanel(b.dataset.panel);}));
function toggleMute(){S.muted=!S.muted;save();updateHUD();if(!S.muted)Snd.click();}
$('muteBtn').addEventListener('click',e=>{e.currentTarget.blur();toggleMute();});

// ---------- input ----------
function localPt(e){const r=canvas.getBoundingClientRect();return {x:e.clientX-r.left,y:e.clientY-r.top};}
canvas.addEventListener('pointerdown',e=>{if(e.button&&e.button!==0)return;e.preventDefault();const p=localPt(e),wp={x:p.x+CAM.x,y:p.y+CAM.y};G.ptrDown=true;
 try{canvas.setPointerCapture(e.pointerId);}catch(_){}
 Snd.get();
 // at the boat: the mouse steers your hand and a click grabs; on a touch screen you drag, then lift your finger to grab
 if(G.state==='landing'){if(e.pointerType==='mouse'){G.aim=p;tryGrab();}else{G.aim={x:p.x,y:p.y-60*Lay.s};G.aimPtr=e.pointerId;}return;}
 // steering the lure: it follows the mouse; a click makes it dash forward so it hits harder
 if(G.state==='lure'){G.aimS=p;if(e.pointerType==='mouse')dash();else G.aimPtrL=e.pointerId;return;}
 if(G.state==='idle'){const st=stationAt(wp.x,wp.y);if(st){useStation(st);return;}
  if(onDeck(wp.x,wp.y)){walkTo((wp.x-Lay.sternX)/Lay.boatL);return;}
  actionPress(wp.x,wp.y);return;}
 G.holding=true;G.reelPtr=e.pointerId;G.dragX0=p.x;G.dragPull=0;actionPress(wp.x,wp.y);});
canvas.addEventListener('pointerleave',()=>{G.hoverSt=null;});
canvas.addEventListener('pointermove',e=>{const p=localPt(e);
 if(e.pointerType==='mouse'){G.hoverSt=G.state==='idle'?stationAt(p.x+CAM.x,p.y+CAM.y):null;if(G.state==='landing')G.aim=p;if(G.state==='lure')G.aimS=p;}
 else{if(G.state==='landing'&&e.pointerId===G.aimPtr)G.aim={x:p.x,y:p.y-60*Lay.s};if(G.state==='lure'&&e.pointerId===G.aimPtrL)G.aimS=p;}
 if(!G.ptrDown)return;
 if(G.state==='reeling'&&e.pointerId===G.reelPtr){const dx=p.x-G.dragX0;G.dragPull=dx>30?1:dx<-30?-1:0;if(Math.abs(dx)>70)G.dragX0=p.x-Math.sign(dx)*70;}});
actBtn.addEventListener('pointerdown',e=>{e.preventDefault();G.holding=true;G.reelPtr=e.pointerId;actionPress();try{actBtn.setPointerCapture(e.pointerId);}catch(_){}});
// the thumbstick: steer the lure; how far you push sets the speed
{const stick=$('stick'),knob=$('stickKnob');let sid=null;
 const setStick=e=>{const r=stick.getBoundingClientRect(),cx=r.left+r.width/2,cy=r.top+r.height/2,R=r.width*0.42;let dx=e.clientX-cx,dy=e.clientY-cy;const d=Math.hypot(dx,dy);if(d>R){dx*=R/d;dy*=R/d;}
  G.stick={x:dx/R,y:dy/R};knob.style.transform='translate('+dx+'px,'+dy+'px)';};
 const endStick=()=>{sid=null;G.stick=null;knob.style.transform='';};
 stick.addEventListener('pointerdown',e=>{e.preventDefault();sid=e.pointerId;Snd.get();try{stick.setPointerCapture(sid);}catch(_){}setStick(e);});
 stick.addEventListener('pointermove',e=>{if(e.pointerId===sid)setStick(e);});
 stick.addEventListener('pointerup',e=>{if(e.pointerId===sid)endStick();});stick.addEventListener('pointercancel',endStick);
 $('dashBtn').addEventListener('pointerdown',e=>{e.preventDefault();Snd.get();dash();});}
// stop iPad pinch-zoom and double-tap zoom from getting in the way of the game
document.addEventListener('gesturestart',e=>e.preventDefault());document.addEventListener('dblclick',e=>e.preventDefault());
// the PULL buttons: hold one with your other thumb while you reel
for(const [id,v] of [['pullL',-1],['pullR',1]]){const b=$(id);
 b.addEventListener('pointerdown',e=>{e.preventDefault();G.btnPull=v;G.pullPtr=e.pointerId;Snd.get();try{b.setPointerCapture(e.pointerId);}catch(_){}});
 b.addEventListener('contextmenu',e=>e.preventDefault());}
function release(e){
 if(e&&G.aimPtr!=null&&e.pointerId===G.aimPtr){G.aimPtr=null;G.ptrDown=false;if(G.state==='landing')tryGrab();return;}
 if(e&&G.aimPtrL!=null&&e.pointerId===G.aimPtrL){G.aimPtrL=null;G.aimS=null;G.aimW=null;G.ptrDown=false;return;}
 if(!e||e.pointerId===G.pullPtr){G.btnPull=0;G.pullPtr=null;if(e)return;}
 if(!e||e.pointerId===G.reelPtr){G.holding=false;G.reelPtr=null;G.dragPull=0;}
 G.ptrDown=false;}
window.addEventListener('pointerup',release);window.addEventListener('pointercancel',release);window.addEventListener('blur',()=>{release();G.keys={};});
actBtn.addEventListener('click',e=>e.preventDefault());
canvas.addEventListener('contextmenu',e=>e.preventDefault());actBtn.addEventListener('contextmenu',e=>e.preventDefault());
const ACT_KEYS=[' ','Spacebar','Enter'];
const DIRS={ArrowLeft:'left',a:'left',A:'left',ArrowRight:'right',d:'right',D:'right',ArrowUp:'up',w:'up',W:'up',ArrowDown:'down',s:'down',S:'down'};
window.addEventListener('keydown',e=>{
 const k=e.key;
 if(!$('catchCard').classList.contains('hidden')){if(ACT_KEYS.indexOf(k)>=0||k==='Escape'){e.preventDefault();if(!e.repeat&&performance.now()-G.cardT>450)closeCatchCard();}return;}
 if(!modal.classList.contains('hidden')){if(k==='Escape')closePanel();return;}
 if(ACT_KEYS.indexOf(k)>=0){e.preventDefault();if(e.repeat)return;G.holding=true;actionPress();}
 else if(DIRS[k]){e.preventDefault();G.keys[DIRS[k]]=true;if(DIRS[k]==='up'&&G.state==='reeling')G.holding=true;}
 else if(k==='e'||k==='E'){const st=nearStation();if(st)openPanel(st.id);}
 else if(k==='m'||k==='M')toggleMute();
});
window.addEventListener('keyup',e=>{if(ACT_KEYS.indexOf(e.key)>=0)G.holding=false;if(DIRS[e.key]){G.keys[DIRS[e.key]]=false;if(DIRS[e.key]==='up')G.holding=false;}});
let rotTip=false;function checkRotate(){if(touchish&&H>W*1.05&&!rotTip){rotTip=true;toast('Turn your iPad sideways for the best view.','',4500);}}
window.addEventListener('resize',()=>{layout();checkRotate();});
document.addEventListener('visibilitychange',()=>{if(document.hidden){release();G.keys={};}});

// ---------- loop ----------
let last=performance.now();
function loop(now){
 const dt=Math.min(0.05,Math.max(0,(now-last)/1000));last=now;G.time+=dt;
 try{update(dt);draw();updateUI();}catch(err){console.error(err);}
 requestAnimationFrame(loop);
}
layout();rollWeather(false);initAmbient();updateHUD();checkRotate();CAM.x=clamp(Lay.sternX+Lay.boatL*0.5-W*0.45,0,Lay.WW-W);
if(!S.seenHelp)openPanel('help');
requestAnimationFrame(loop);
// tiny hook for automated testing (harmless for players)
window.__fishing={get S(){return S;},get G(){return G;},get Lay(){return Lay;},FISH,LOCS,RODS,BUCKETS,LURES,KEY,WX,CAM,TER,rollWeather,landGeom,tryGrab,hookFish,spawnFish,initAmbient,step(dt){G.time+=dt;update(dt);},render(){draw();updateUI();}};
</script>
</body>
</html>
